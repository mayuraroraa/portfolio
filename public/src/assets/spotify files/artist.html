<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist - Spotify Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- TOP NAVBAR (Identical to index) -->
    <nav class="navbar spotify-navbar">
        <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap">
            <div class="nav-left d-flex align-items-center gap-2">
                <div class="nav-logo d-none d-sm-block">
                    <a href="index.html" class="text-white"><i class="fa-brands fa-spotify logo-icon"></i></a>
                </div>
                <button type="button" class="nav-circle-btn" onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-house"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN GRID LAYOUT -->
    <div class="row m-0 px-2 g-2 spotify-main-layout">
        
        <!-- LEFT SIDEBAR -->
        <div class="col-md-4 col-lg-3 d-none d-md-flex h-100">
            <aside class="sidebar d-flex flex-column w-100 h-100">
                <header class="library-header d-flex justify-content-between align-items-center px-4 py-3">
                    <a href="index.html" class="library-title text-decoration-none d-flex align-items-center gap-3">
                        <i class="fa-solid fa-book-open fs-4"></i><span class="fw-bold fs-6">Your Library</span>
                    </a>
                </header>
            </aside>
        </div>

        <!-- DYNAMIC ARTIST CONTENT -->
        <div class="col-12 col-md-8 col-lg-9 h-100">
            <main class="main-content-area w-100 h-100 p-0"> 
                
                <div class="artist-banner d-flex align-items-end px-4 pb-4">
                    <div class="artist-info text-white">
                        <span class="text-uppercase fw-bold small d-flex align-items-center gap-2 mb-2">
                            <i class="fa-solid fa-circle-check text-primary"></i> Verified Artist
                        </span>
                        <h1 id="artist-name" class="artist-main-title fw-bold mb-3"></h1>
                        <span id="artist-listeners" class="fw-bold"></span>
                    </div>
                </div>

                <div class="p-4">
                    <div class="album-action-bar d-flex align-items-center gap-4 mb-4">
                        <button class="album-play-btn shadow"><i class="fa-solid fa-play"></i></button>
                        <button class="btn btn-outline-light rounded-pill fw-bold px-3 py-1">Follow</button>
                        <button class="action-icon-btn"><i class="fa-solid fa-ellipsis"></i></button>
                    </div>

                    <h4 class="text-white fw-bold mb-3">Popular</h4>
                    
                    <!-- JS Injects Popular Tracks Here -->
                    <div id="artist-track-list" class="tracklist-container mb-5"></div>
                </div>

            </main>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
